// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  ext.kotlin_version = '1.3.70'
  ext.koin_version = '2.0.1'
  ext.glide_version = '4.10.0'
  ext.retrofit_version = '2.7.1'
  ext.moshi_version = '1.9.2'
  ext.rxjava_version = '2.2.12'
  ext.timber_version = '4.7.1'
  ext.threeten_version = '1.2.2'
  ext.okhttp_logging_version = '4.3.1'

  repositories {
    google()
    jcenter()

  }
  dependencies {
    classpath 'com.android.tools.build:gradle:4.1.0-alpha02'
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    // NOTE: Do not place your application dependencies here; they belong
    // in the individual module build.gradle files
  }
}

allprojects {
  repositories {
    google()
    jcenter()
  }
}

task clean(type: Delete) {
  delete rootProject.buildDir
}