apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-android-extensions'
apply plugin: 'kotlin-kapt'

def keystorePropertiesFile = rootProject.file("./signing/keystore.properties")
def keystoreProperties = new Properties()
keystoreProperties.load(new FileInputStream(keystorePropertiesFile))

android {
  compileSdkVersion 30

  defaultConfig {
    applicationId "com.coloplast.olympus"
    minSdkVersion 23
    targetSdkVersion 30
    versionCode gitVersionCode()
    versionName "1.9.2"
    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

    buildConfigField("Long", "BuildTime", System.currentTimeMillis() + "L")
    buildConfigField("String", "AppCenterSecret", "\"b1dc9278-cd5e-4670-a328-5936c7343ce9\"")
  }

  sourceSets {
    main {
      res.srcDirs = ['src/main/res', 'src/main/i18n']
    }
  }

  flavorDimensions "type"
  productFlavors {
    dev {
      applicationIdSuffix ".dev"
      buildConfigField("String", "Suffix", "\" - DEV\"")

      buildConfigField("String", "ServerUrl", "\"https://cp-fc-be-dev.azurewebsites.net\"")
      buildConfigField("String", "AzureUrl", "\"https://cp-fc-dev.azurefd.net/api/\"")
      buildConfigField("String", "AzureCode", "\"1aiab34Rsqn2jSVcyXevoG9rvS0HjS9lqf5g8XsUV8BnzRVk3a9u1g==\"")
    }
    cli {
      applicationIdSuffix ".cli"
      buildConfigField("String", "Suffix", "\" - CLI\"")

      buildConfigField("String", "ServerUrl", "\"https://cp-fc-be-clinical.azurewebsites.net\"")
      buildConfigField("String", "AzureUrl", "\"https://cp-fc-clinical.azurefd.net/api/\"")
      buildConfigField("String", "AzureCode", "\"goQ2ylfRfYlgfIKf1uQ/F2C32bFyp9qVZsWwtxPupJYrvGxBiDaXPA==\"")
    }
    tpa {
      applicationIdSuffix ".tpa"
      buildConfigField("String", "Suffix", "\" - TPA\"")

      buildConfigField("String", "ServerUrl", "\"https://cp-fc-be-test.azurewebsites.net\"")
      buildConfigField("String", "AzureUrl", "\"https://cp-fc-test.azurefd.net/api/\"")
      buildConfigField("String", "AzureCode", "\"yBcdDaPPWKYaL160/7aXnd55ehvzukND6ng3oawFaApU1xd891QtwQ==\"")
    }
    internal {
      applicationIdSuffix ".internal"
      buildConfigField("String", "Suffix", "\" - internal\"")

      buildConfigField("String", "ServerUrl", "\"https://cp-fc-be-test.azurewebsites.net\"")
      buildConfigField("String", "AzureUrl", "\"https://cp-fc-test.azurefd.net/api/\"")
      buildConfigField("String", "AzureCode", "\"yBcdDaPPWKYaL160/7aXnd55ehvzukND6ng3oawFaApU1xd891QtwQ==\"")
    }
    googlePlay {
      buildConfigField("String", "Suffix", "\"\"")

      buildConfigField("String", "ServerUrl", "\"https://cp-fc-be-prod.azurewebsites.net\"")
      buildConfigField("String", "AzureUrl", "\"https://cp-fc-prod.azurefd.net/api/\"")
      buildConfigField("String", "AzureCode", "\"irAejdDg5M3Tq53GX5FM5m0aM0AU0KD3BdtYBQaMhB9IYDudHWcbgw==\"")
    }
  }

  signingConfigs {
    release {
      keyAlias keystoreProperties['private_alias_release']
      keyPassword keystoreProperties['private_password_release']
      storeFile file(keystoreProperties['storeFile'])
      storePassword keystoreProperties['storePassword']
    }
    debug {
      keyAlias keystoreProperties['private_alias_debug']
      keyPassword keystoreProperties['private_password_debug']
      storeFile file(keystoreProperties['storeFile'])
      storePassword keystoreProperties['storePassword']
    }
  }

  buildTypes {
    debug {
      signingConfig signingConfigs.debug
      minifyEnabled false
    }

    release {
      signingConfig signingConfigs.release
      minifyEnabled true

      proguardFile './proguard/timber.pro'
      proguardFile './proguard/mpandroidchart.pro'
      proguardFile './proguard/support_libraries.pro'
      proguardFile './proguard/updateTreatmentItemsUI.pro'
      proguardFile './proguard/crashlytics.pro'
      proguardFile './proguard/rxjava2.pro'
      proguardFile './proguard/project.pro'
      proguardFile './proguard/firebase.pro'
      proguardFile './proguard/jodatime.pro'
      proguardFile './proguard/glide.pro'
      proguardFile './proguard/databinding.pro'
      proguardFile './proguard/okhttp.pro'
      proguardFile './proguard/kotlin.pro'
      proguardFile './proguard/moshi.pro'
      proguardFile getDefaultProguardFile('proguard-android.txt')
    }
  }

  buildFeatures {
    dataBinding = true
  }

  compileOptions {
    coreLibraryDesugaringEnabled true

    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }

  androidExtensions {
    experimental = true
  }

  kotlinOptions {
    jvmTarget = JavaVersion.VERSION_1_8.toString()
  }
}

dependencies {
  implementation project(':businesslayer')
  implementation project(':blebusinesslayer')

  coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:$desuger_lib"

  // Android
  implementation 'com.google.android.material:material:1.3.0-alpha03'

  implementation 'androidx.appcompat:appcompat:1.2.0'
  implementation 'androidx.core:core-ktx:1.5.0-beta01'
  implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
  implementation 'androidx.cardview:cardview:1.0.0'
  implementation 'androidx.recyclerview:recyclerview:1.1.0'

  // Kotlin + coroutines
  implementation "androidx.work:work-runtime-ktx:$work_version"

  // optional - RxJava2 support
  implementation "androidx.work:work-rxjava2:$work_version"

  // Reactive
  implementation 'com.artemzin.rxui2:rxui-kotlin:2.0.0'
  implementation 'com.jakewharton.rxrelay2:rxrelay:2.1.1'

  // Koin
  implementation "org.koin:koin-android:$koin_version"

  // Conductor
  implementation 'com.bluelinelabs:conductor:3.0.0-rc2'

  // binding adapters
  implementation 'me.tatarka.bindingcollectionadapter2:bindingcollectionadapter:4.0.0'
  implementation 'me.tatarka.bindingcollectionadapter2:bindingcollectionadapter-recyclerview:4.0.0'

  //LifeCycle
  implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.3.0"
  implementation "androidx.lifecycle:lifecycle-extensions:2.2.0"

  //Microsoft Analytics
  implementation "com.microsoft.appcenter:appcenter-analytics:${appCenterSdkVersion}"
  implementation "com.microsoft.appcenter:appcenter-crashes:${appCenterSdkVersion}"

  testImplementation 'junit:junit:4.13.1'
  androidTestImplementation "org.koin:koin-test:$koin_version"
  androidTestImplementation 'androidx.test.ext:junit:1.1.2'
  androidTestImplementation 'androidx.test.espresso:espresso-core:3.3.0'

  // optional - Test helpers
  androidTestImplementation "androidx.work:work-testing:$work_version"
}

static def gitVersionCode() {
  def process = "git rev-list HEAD --count".execute()
  return process.text.toInteger()
}
